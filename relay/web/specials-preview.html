<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Relay · Specials preview</title>
<link rel="stylesheet" href="/static/relay.css">
<link rel="stylesheet" href="/static/specials.css">
<style>
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
section { padding: 72px 0; }
.kicker { font-size: 14px; color: var(--accent); font-weight: 650; margin: 0 0 10px; letter-spacing: .01em; }
h2 { font: 740 clamp(32px, 4.6vw, 50px)/1.04 var(--display); letter-spacing: -.04em; margin: 0 0 36px; max-width: 18ch; }
@media (max-width: 560px) { section { padding: 56px 0; } }
</style>
</head>
<body>
<main>
  <section id="specials">
    <div class="wrap">
      <p class="kicker">Specials</p>
      <h2>Put them to work.</h2>
      <div id="specials-grid"></div>
    </div>
  </section>
</main>
<script src="/static/specials.js"></script>
</body>
</html>
