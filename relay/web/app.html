<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<title>Relay</title>
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/relay.css">
<style>
/* app shell */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid transparent;
  transition: border-color .3s var(--ease); }
.bar.scrolled { border-bottom-color: var(--sep); }
.bar-in { max-width: 680px; margin: 0 auto; height: 52px; padding: 0 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.bar-in > :last-child { justify-self: end; }
.page { max-width: 680px; margin: 0 auto; padding: 8px 16px calc(110px + env(safe-area-inset-bottom)); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 18px 0 22px; }
.topseg { width: 220px; }
.brandmini { display: inline-flex; align-items: center; gap: 8px; font: 650 17px/1 var(--display); letter-spacing: -.02em; }
.brandmini .mark { width: 22px; height: 22px; }
@media (max-width: 480px) { .brandmini .word { display: none; } }
.sticky-status { position: sticky; top: 60px; z-index: 3; background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
  padding: 10px 16px; justify-self: start; }

/* activity */
.conv .cell { min-height: 68px; align-items: flex-start; padding-top: 12px; padding-bottom: 12px; }
.conv .cell::before { left: 68px !important; }
.conv .when { font-size: 13px; color: var(--ink2); flex: none; }
.preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thread .cell { align-items: flex-start; padding-top: 12px; padding-bottom: 12px; }
.thread .cell::before { left: 68px !important; }
.thread .from { font-size: 15px; font-weight: 600; }
.thread .from .when { font-weight: 400; color: var(--ink2); font-size: 13px; margin-left: 6px; }
.thread .text { font-size: 16px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.thread .sys { font-size: 13px; color: var(--ink2); }
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep);
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); animation: rise .4s var(--ease) both; }
.composer form { max-width: 680px; margin: 0 auto; padding: 0 16px; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 48px; max-height: 140px; padding: 13px 18px; border: 0; border-radius: var(--r); background: var(--card);
  color: var(--ink); font: 16px/1.4 var(--font); outline: none; box-shadow: var(--shadow); }
.composer .btn { width: auto; padding: 0 22px; height: 48px; }

/* profile */
.profile { display: grid; justify-items: center; gap: 10px; margin: 18px 0 26px; text-align: center; }
.profile .title { font-size: 28px; }
.address { font: 14px var(--mono); color: var(--ink2); }
.quick { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
.quick .q { display: grid; justify-items: center; gap: 4px; min-width: 84px; padding: 10px 12px; border: 0; border-radius: var(--r-sm); background: var(--card);
  box-shadow: var(--shadow); color: var(--blue); font-size: 12px; cursor: pointer; }
.quick .q svg { width: 22px; height: 22px; }

/* sign-in */
.welcome { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
.welcome-in { width: 100%; max-width: 420px; display: grid; gap: 28px; }
.brandline { display: grid; justify-items: center; gap: 14px; text-align: center; }
.brandline .mark { width: 56px; height: 56px; }
</style>
</head>
<body>
<header class="bar hidden" id="bar">
  <div class="bar-in">
    <div><button class="link sm hidden press" id="back">‹ Back</button><span class="brandmini" id="brandmini"></span></div>
    <div class="seg topseg" id="topseg" role="group">
      <button data-go="agents" aria-pressed="true">Agents</button>
      <button data-go="activity" aria-pressed="false">Activity</button>
    </div>
    <div id="bar-right"></div>
  </div>
</header>
<main id="app"></main>

<script src="/static/app.js"></script>
</body>
</html>
