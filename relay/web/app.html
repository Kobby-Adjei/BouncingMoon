<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)">
<title>Relay</title>
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/relay.css">
<style>
/* app shell */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid transparent;
  transition: border-color .3s var(--ease); }
.bar.scrolled { border-bottom-color: var(--sep); }
.bar-in { max-width: 680px; margin: 0 auto; height: 56px; padding: 0 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.bar-in > :last-child { justify-self: end; }
.backbtn { display: inline-flex; align-items: center; gap: 4px; margin-left: -6px; }
.backbtn svg { width: 10px; height: 17px; }
.page { max-width: 680px; margin: 0 auto; padding: 8px 16px calc(120px + env(safe-area-inset-bottom)); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 22px; }
.topseg { width: 210px; }
.brandmini { display: inline-flex; align-items: center; gap: 8px; font: 680 17px/1 var(--display); letter-spacing: -.02em; }
.brandmini .mark { width: 24px; height: 24px; }
@media (max-width: 480px) { .brandmini .word { display: none; } }
.mebtn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
.sticky-status { position: sticky; top: 64px; z-index: 3; background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
  padding: 10px 18px 10px 14px; justify-self: center; }
.sticky-status.ok { animation: pop .5s var(--spring) both; }

/* hero blocks: one big picture per screen */
.hero { display: grid; justify-items: center; gap: 12px; margin: 10px 0 26px; text-align: center; }
.hero .title { font-size: 30px; }
.hero .lede { margin: 0; }
.hero > .av { animation: settle .6s var(--spring) both; }

/* the link diagram: app ---- relay; draws solid the moment it connects */
.linkup { display: grid; grid-template-columns: auto 1fr auto; align-items: center; width: min(100%, 320px); margin: 6px auto 0; }
.linkup .av { animation: settle .6s var(--spring) both; }
.linkup .av:last-child { animation-delay: .12s; }
.linkup .wire { position: relative; height: 40px; display: grid; place-items: center; }
.linkup svg.line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.linkup .base { stroke: var(--ink3); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; fill: none; }
.linkup .live { stroke: var(--green); stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 100; stroke-dashoffset: 100; }
.linkup .node { position: relative; width: 30px; height: 30px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow);
  display: grid; place-items: center; }
.linkup .node .dot { width: 10px; height: 10px; }
.linkup.done .live { animation: draw .6s var(--ease) forwards; }
.linkup.done .node { background: transparent; box-shadow: none; }
.linkup.done .node .tick { width: 30px; height: 30px; }
.linkup.done .av { animation: bump .5s .45s var(--spring) both; }
@media (prefers-reduced-motion: reduce) { .linkup.done .live { stroke-dashoffset: 0; } }

/* empty states */
.blank { display: grid; justify-items: center; gap: 14px; padding: 36px 16px 24px; text-align: center; color: var(--ink2); }
.blank .t { font: 650 20px/1.2 var(--display); color: var(--ink); letter-spacing: -.02em; }
.orbit { position: relative; width: 168px; height: 120px; }
.orbit > * { position: absolute; }
.orbit .core { left: 54px; top: 30px; width: 60px; height: 60px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-lift);
  display: grid; place-items: center; animation: settle .6s var(--spring) both; }
.orbit .core .mark { width: 34px; height: 34px; }
.orbit .ghost { width: 38px; height: 38px; border-radius: 12px; border: 2px dashed var(--ink3); animation: pop .6s var(--spring) both; }
.orbit .g1 { left: 0; top: 4px; animation-delay: .15s; } .orbit .g2 { right: 0; top: 0; animation-delay: .25s; }
.orbit .g3 { right: 14px; bottom: 0; animation-delay: .35s; } .orbit .g4 { left: 12px; bottom: 6px; animation-delay: .3s; border-radius: 50%; }

/* activity */
.conv .cell { min-height: 72px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
.conv .cell::before { left: 84px !important; }
.conv .stackav { width: 54px; }
.conv .when { font-size: 13px; color: var(--ink2); flex: none; }
.preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.jobcell .btn { flex: none; }

/* thread: bubbles */
.chat { display: grid; gap: 4px; }
.msg { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: bubble .4s var(--ease) both; }
.msg.mine { margin-left: auto; flex-direction: row-reverse; }
.msg .ghostav { width: 32px; flex: none; }
.msg .body { min-width: 0; display: grid; }
.msg .who { font-size: 12px; color: var(--ink2); margin: 10px 0 4px 12px; }
.msg.mine .who { text-align: right; margin: 10px 12px 4px 0; }
.msg .bub { background: var(--card); box-shadow: var(--shadow); padding: 10px 15px; border-radius: 20px; font-size: 16px;
  white-space: pre-wrap; overflow-wrap: anywhere; justify-self: start; }
.msg.mine .bub { background: var(--accent); color: var(--on-accent); box-shadow: none; justify-self: end; }
.sysmsg { justify-self: center; font-size: 13px; color: var(--ink2); background: var(--fill); padding: 6px 12px; border-radius: 999px;
  margin: 10px 0; max-width: 92%; text-align: center; overflow-wrap: anywhere; animation: fade .4s var(--ease) both; }
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep);
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); animation: rise .45s var(--ease) both; }
.composer form { max-width: 680px; margin: 0 auto; padding: 0 16px; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 48px; max-height: 140px; padding: 13px 18px; border: 0; border-radius: 24px; background: var(--card);
  color: var(--ink); font: 16px/1.4 var(--font); outline: none; box-shadow: var(--shadow); }
.composer textarea::placeholder { color: var(--ink2); }
.composer .send { width: 48px; height: 48px; padding: 0; flex: none; }
.composer .send svg { width: 20px; height: 20px; }

/* profile */
.profile { display: grid; justify-items: center; gap: 8px; margin: 14px 0 26px; text-align: center; }
.profile .title { font-size: 30px; margin-top: 6px; }
.profile > .av { animation: settle .6s var(--spring) both; }
.quick { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
.quick .q { display: grid; justify-items: center; gap: 6px; width: 92px; padding: 12px 8px 10px; border: 0; border-radius: var(--r); background: var(--card);
  box-shadow: var(--shadow); color: var(--accent); font-size: 13px; font-weight: 560; cursor: pointer; }
.quick .q svg { width: 24px; height: 24px; }
.pill-tag { display: inline-block; font-size: 12px; font-weight: 620; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.inlineform { display: grid; gap: 10px; padding: 4px 16px 16px; }
.inlineform .row .btn { flex: 1; }

/* sign-in */
.welcome { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
.welcome-in { width: 100%; max-width: 400px; display: grid; gap: 30px; }
.brandline { display: grid; justify-items: center; gap: 12px; text-align: center; }
.brandline .mark { width: 64px; height: 64px; }
.brandline .lede { margin: 0; }
.crew { display: flex; gap: 8px; margin-top: 2px; }
.crew .av { animation: pop .5s var(--spring) both; }
.crew .av:nth-child(1) { animation-delay: .35s; } .crew .av:nth-child(2) { animation-delay: .42s; } .crew .av:nth-child(3) { animation-delay: .49s; }
.crew .av:nth-child(4) { animation-delay: .56s; } .crew .av:nth-child(5) { animation-delay: .63s; }
.alt { display: flex; justify-content: center; }
.check { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink2); font-size: 15px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.envelope { width: 112px; height: 92px; overflow: visible; }
.envelope .paper { fill: var(--card); }
.envelope .edge { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.envelope .seal { fill: var(--sun); transform-origin: 56px 52px; transform-box: view-box; animation: settle .55s .55s var(--spring) both; }
.envelope .body { animation: rise .6s var(--ease) both; }
.notice { background: var(--card); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 12px 16px; color: var(--red); font-size: 15px;
  text-align: center; animation: rise .45s var(--ease) both; }
.notice:empty { display: none; }
@media (min-width: 900px) { .title { font-size: 38px; } }
</style>
</head>
<body>
<header class="bar hidden" id="bar">
  <div class="bar-in">
    <div><button class="link sm hidden press backbtn" id="back"><svg viewBox="0 0 10 17" aria-hidden="true"><path d="M8.5 1.5L1.5 8.5l7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button><span class="brandmini" id="brandmini"></span></div>
    <div class="seg topseg" id="topseg" role="group">
      <button data-go="agents" aria-pressed="true">Agents</button>
      <button data-go="activity" aria-pressed="false">Activity</button>
    </div>
    <div id="bar-right"></div>
  </div>
</header>
<main id="app"></main>

<script src="/static/app.js"></script>
</body>
</html>
