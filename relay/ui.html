<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Relay</title>
<style>
:root {
  --bg: #f4f3f1; --card: #ffffff; --ink: #1f1f22; --ink2: #6f6e73; --ink3: #b4b3b8;
  --sep: rgba(31, 31, 34, .08); --fill: rgba(31, 31, 34, .055);
  --blue: #3d6df2; --blue-soft: rgba(61, 109, 242, .10); --green: #2fb36b; --orange: #e8a23a; --red: #e5484d;
  --shadow: 0 1px 2px rgba(31, 31, 34, .04), 0 6px 24px rgba(31, 31, 34, .05);
  --r: 18px; --ease: cubic-bezier(.22, .8, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113; --card: #1c1c1f; --ink: #f2f2f4; --ink2: #9b9aa1; --ink3: #5c5b62;
    --sep: rgba(255, 255, 255, .07); --fill: rgba(255, 255, 255, .07);
    --blue: #4a7bff; --blue-soft: rgba(74, 123, 255, .16); --green: #4cd486; --orange: #f0b25a; --red: #ff6b6f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
.view { animation: enter .42s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } * { transition: none !important; } }

/* top bar */
.bar { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--sep); }
.bar-in { max-width: 680px; margin: 0 auto; height: 52px; padding: 0 16px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.bar-in > :last-child { justify-self: end; }

/* page */
.page { max-width: 680px; margin: 0 auto; padding: 8px 16px 64px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 20px 0 22px; }
h1 { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; margin: 0; overflow-wrap: anywhere; }
.lede { color: var(--ink2); font-size: 15px; margin: 8px 0 0; }

/* grouped list */
.group { background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.cell { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; position: relative;
  width: 100%; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
button.cell { cursor: pointer; }
button.cell { transition: background-color .25s var(--ease); }
button.cell:hover { background: var(--fill); }
button.cell:active { background: var(--fill); }
.cell .grow { flex: 1; min-width: 0; }
.cell .t { font-size: 17px; overflow-wrap: anywhere; }
.cell .s { font-size: 13px; color: var(--ink2); margin-top: 1px; overflow-wrap: anywhere; }
.cell .v { color: var(--ink2); font-size: 15px; text-align: right; }
.chev { color: var(--ink3); font-size: 20px; line-height: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); flex: none; transition: background-color .5s var(--ease); }
.dot.on { background: var(--green); } .dot.recent { background: var(--orange); } .dot.wait { background: transparent; border: 1.5px solid var(--ink3); }
.foot { color: var(--ink2); font-size: 13px; margin: 8px 16px 0; }
.empty { color: var(--ink2); font-size: 15px; padding: 18px 16px; }

/* controls */
input[type=text], input[type=password] { width: 100%; height: 54px; padding: 0 18px; border: 0; border-radius: var(--r);
  background: var(--card); color: var(--ink); font: inherit; outline: none; box-shadow: var(--shadow);
  transition: box-shadow .3s var(--ease); }
input::placeholder { color: var(--ink3); }
input:focus { box-shadow: var(--shadow), 0 0 0 4px var(--blue-soft); }
.btn { display: block; width: 100%; height: 54px; border: 0; border-radius: var(--r); background: var(--blue); color: #fff;
  font: inherit; font-weight: 600; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .2s var(--ease), opacity .3s var(--ease), background-color .3s var(--ease); }
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.plain { background: var(--card); color: var(--blue); }
.btn.done { background: var(--green); }
.btn.danger { background: var(--card); color: var(--red); }
.link { border: 0; background: none; color: var(--blue); font: inherit; padding: 6px 0; cursor: pointer; }
.link.small { font-size: 15px; }
.link.red { color: var(--red); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink2); font-family: inherit; font-size: 13px; font-weight: 500;
  height: 30px; border-radius: 8px; cursor: pointer; transition: background-color .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease); }
.seg button[aria-pressed=true] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.bar .seg { width: 210px; }
.brandmark { font-weight: 650; font-size: 17px; letter-spacing: -.02em; }
.link.on-card { color: var(--blue); }
.cell .v.link-v { color: var(--blue); }
.stack { display: grid; gap: 22px; }
.caption { color: var(--ink2); font-size: 13px; margin: 8px 16px 0; min-height: 1.4em; }
.err { color: var(--red); font-size: 13px; margin: 8px 16px 0; min-height: 1.4em; }
pre { margin: 0; padding: 18px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); white-space: pre-wrap; word-break: break-word;
  font: 13px/1.55 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; max-height: 52vh; overflow: auto; }
.status { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 15px; margin: 12px 6px 0; transition: color .4s var(--ease); }
.status.ok { color: var(--green); }

/* activity */
.msg { padding: 12px 16px; position: relative; }
.msg + .msg::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.msg .who { font-size: 15px; font-weight: 600; }
.msg .when { color: var(--ink2); font-size: 13px; font-weight: 400; margin-left: 6px; }
.msg .text { font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; white-space: pre-wrap; }
.compose { display: flex; gap: 10px; }
.compose input { flex: 1; }
.compose .btn { width: auto; padding: 0 20px; }

/* provider marks */
.av { --s: 40px; position: relative; width: var(--s); height: var(--s); flex: none; border-radius: calc(var(--s) * .28);
  background: var(--fill); display: inline-grid; place-items: center; color: var(--ink); }
.av svg { width: 54%; height: 54%; }
.av img { width: 58%; height: 58%; display: block; user-select: none; }
.av.full { background: transparent; }
.av.full img { width: 100%; height: 100%; border-radius: inherit; box-shadow: 0 0 0 .5px var(--sep); }
.av .mono { font-size: calc(var(--s) * .36); font-weight: 650; letter-spacing: -.02em; color: var(--ink2); }
.av.person { border-radius: 50%; background: var(--blue-soft); }
.av.person .mono, .av.person.glyph { color: var(--blue); }
.av.glyph { color: var(--ink2); }
.av .badge { position: absolute; right: -2px; bottom: -2px; width: calc(var(--s) * .3); height: calc(var(--s) * .3);
  max-width: 14px; max-height: 14px; box-shadow: 0 0 0 2.5px var(--card); }
.top .av .badge { box-shadow: 0 0 0 3px var(--bg); }
.fade { opacity: .55; display: inline-flex; }

/* "runs on" picker */
.pick-wrap { padding: 14px 16px 12px; }
.label { font-size: 13px; color: var(--ink2); margin-bottom: 10px; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.opt { display: grid; justify-items: center; gap: 6px; padding: 10px 4px 8px; border: 0; border-radius: 14px;
  background: transparent; color: var(--ink2); font: 13px/1.2 inherit; font-family: inherit; cursor: pointer;
  transition: background-color .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease); }
.opt:hover { background: var(--fill); }
.opt[aria-checked=true] { background: var(--blue-soft); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--blue); }
.cell.off { opacity: .35; pointer-events: none; transition: opacity .3s var(--ease); }

/* switch */
.switch { position: relative; width: 51px; height: 31px; flex: none; border: 0; border-radius: 999px; background: var(--fill);
  cursor: pointer; transition: background-color .35s var(--ease); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.16); transition: transform .35s var(--ease); }
.switch[aria-checked=true] { background: var(--green); }
.switch[aria-checked=true]::after { transform: translateX(20px); }

.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg .grow { flex: 1; min-width: 0; }
.msg + .msg::before { left: 60px; }
.group.people .cell + .cell::before { left: 68px; }
.group > div:not(.cell) + .cell::before, .group > .cell + div > .cell::before,
.pick-wrap + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.hidden { display: none !important; }
</style>
</head>
<body>
<nav class="bar hidden" id="bar">
  <div class="bar-in">
    <div><button class="link small hidden" id="nav-back">‹ Agents</button><span class="brandmark" id="nav-brand">Relay</span></div>
    <div class="seg" id="nav-seg" role="group">
      <button data-go="agents" aria-pressed="true">Agents</button>
      <button data-go="activity" aria-pressed="false">Activity</button>
    </div>
    <button class="link small" id="nav-out">Sign out</button>
  </div>
</nav>
<div class="page" id="app"></div>
<script src="/ui.js"></script>
</body>
</html>
